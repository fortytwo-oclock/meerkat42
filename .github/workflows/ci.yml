name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Cross-build agent
        run: |
          python scripts/build_agent_artifacts.py --output-dir /tmp/agent-dist
          cd /tmp/agent-dist
          sha256sum --check SHA256SUMS

  hub:
    name: Python hub and migrations
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hub/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r hub/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q hub scripts
      - run: mkdir -p data
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
      - run: python -m unittest discover -s hub/tests -v
      - name: Prove SQLite backup restoration
        run: |
          python scripts/hub_backup.py --output-dir /tmp/hub-backups
          python scripts/verify_hub_restore.py /tmp/hub-backups/*.sqlite3

  dependency-review:
    name: Dependency review
    # GitHub only offers dependency review on public repos (or with Advanced Security);
    # on a private repo the action always errors. Runs again automatically once public.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The lock file must be written by the npm that ships with this Node (npm 10); newer npm
      # records optional deps differently and `npm ci` rejects the lock. After dependency changes:
      #   cd frontend && npx -y npm@10 install --package-lock-only
      - run: npm ci
      - run: npm run build

  deployment:
    name: Deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file deploy/self-host.env.example -f deploy/docker-compose.hub.yml config
      - run: AGENT_ENV_FILE=agent.env.example docker compose -f deploy/docker-compose.agent.yml config
      - run: docker compose --env-file deploy/cloud.env.example -f deploy/docker-compose.cloud.yml config
      - run: python scripts/bootstrap_cloud.py --domain monitor.example.com --output /tmp/cloud.env
      - run: docker compose --env-file /tmp/cloud.env -f deploy/docker-compose.cloud.yml -f deploy/docker-compose.pangolin.yml config
      - run: docker compose --env-file deploy/test.env.example -p control-plane-test -f deploy/docker-compose.test.yml config
      - run: docker compose --env-file deploy/pi.env.example -f deploy/docker-compose.pi.yml config
