name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Cross-build agent
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/agent-linux-amd64 ./cmd/agent
          GOOS=linux GOARCH=arm64 go build -o /tmp/agent-linux-arm64 ./cmd/agent

  hub:
    name: Python hub and migrations
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hub/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r hub/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q hub scripts
      - run: mkdir -p data
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
      - run: python -m unittest discover -s hub/tests -v
      - name: Prove SQLite backup restoration
        run: |
          python scripts/hub_backup.py --output-dir /tmp/hub-backups
          python scripts/verify_hub_restore.py /tmp/hub-backups/*.sqlite3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deployment:
    name: Deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file deploy/cloud.env.example -f deploy/docker-compose.cloud.yml config
      - run: docker compose --env-file deploy/test.env.example -p control-plane-test -f deploy/docker-compose.test.yml config
