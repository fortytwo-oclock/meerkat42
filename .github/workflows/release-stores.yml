name: Release & Store Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  agent-binaries:
    name: Cross-build Go Edge Agents (Linux, macOS, Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all 9 OS/arch targets
        run: |
          python3 scripts/build_agent_artifacts.py --output-dir dist/agents
          (cd dist/agents && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: meerkat42-agents
          path: dist/agents/*

  docker-images:
    name: Build Multi-Arch Container Images (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository_owner }}/meerkat42-hub:${{ github.ref_name }}
      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository_owner }}/meerkat42-web:${{ github.ref_name }}
      - name: Build Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository_owner }}/meerkat42-agent:${{ github.ref_name }}

  windows-store-app:
    name: Build Windows App (Microsoft Store / Intune)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/meerkat_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Sign MSIX bundle when Microsoft Partner Center secrets are configured
        if: env.WINDOWS_CERT_BASE64 != ''
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          Write-Host "Certificate materialized for MSIX signing (Partner Center / Intune)."
      - uses: actions/upload-artifact@v4
        with:
          name: meerkat42-windows-release
          path: apps/meerkat_app/build/windows/x64/runner/Release/**

  apple-store-apps:
    name: Build macOS & iOS Apps (Apple App Store / ABM)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/meerkat_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Build iOS Archive (signed when Apple Developer secrets are set)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_TEAM_ID" ]; then
            flutter build ipa --release
          else
            flutter build ios --release --no-codesign
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: meerkat42-macos-app
          path: apps/meerkat_app/build/macos/Build/Products/Release/*.app

  android-play-app:
    name: Build Android App Bundle (Google Play / Managed Google Play)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/meerkat_app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Decode Play App Signing keystore when configured
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - run: flutter pub get
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: meerkat42-android-aab
          path: apps/meerkat_app/build/app/outputs/bundle/release/*.aab
