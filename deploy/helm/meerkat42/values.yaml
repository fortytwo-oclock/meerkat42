# Default values for Meerkat42 Cloud / Enterprise Helm Chart

hub:
  replicas: 2
  image:
    repository: ghcr.io/fortytwo-oclock/meerkat42-hub
    tag: "v2.0.0"
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

worker:
  # Always run exactly 1 worker replica to avoid duplicate rollups & alert dispatches.
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/fortytwo-oclock/meerkat42-web
    tag: "v2.0.0"
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Reference a pre-existing Kubernetes Secret containing DATABASE_URL, REDIS_URL,
# ADMIN_TOKEN, AGENT_BOOTSTRAP_TOKEN, and optional OIDC/Stripe/Push Relay secrets.
existingSecret: "meerkat42-secrets"

config:
  logLevel: "INFO"
  autoMigrate: "false"
  corsOrigins: "https://monitor.example.com"
  pushRelayUrl: ""
  oidcProviderName: ""
  oidcIssuerUrl: ""
  oidcClientId: ""
  oidcRedirectUri: ""

ingress:
  enabled: true
  className: nginx
  host: monitor.example.com
  tlsSecretName: meerkat42-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
