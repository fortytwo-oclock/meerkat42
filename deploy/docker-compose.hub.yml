services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.hub
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HUB_PORT:-8080}:8080"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/hub.db
      ADMIN_TOKEN: ${ADMIN_TOKEN:?run python scripts/bootstrap_self_host.py}
      AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:?run python scripts/bootstrap_self_host.py}
      ED25519_PUBLIC_KEY: ${ED25519_PUBLIC_KEY:-31iGBIN15cAlkXmYXYLwZTXJYR9Yngjzf187Bf+s+xA=}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - hub-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        HUB_URL: http://hub:8080
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-3000}:3000"
    environment:
      HUB_URL: http://hub:8080
    depends_on:
      hub:
        condition: service_healthy

volumes:
  hub-data:
