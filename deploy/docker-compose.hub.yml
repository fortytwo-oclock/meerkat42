version: '3.8'

services:
  control-plane-hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.hub
    container_name: control-plane-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ED25519_PUBLIC_KEY=31iGBIN15cAlkXmYXYLwZTXJYR9Yngjzf187Bf+s+xA=
      - LOG_LEVEL=info
      # Shared secret every edge agent must present (must match the agent's AUTH_TOKEN).
      - AGENT_BOOTSTRAP_TOKEN=agent_secret_token_change_me
      # Required for mutating REST endpoints (license/groups/alert-rules/ack) and
      # to act as an "owner" for token management. Leave unset only for a trusted
      # single-operator LAN deployment with no issued API tokens.
      - ADMIN_TOKEN=admin_token_change_me
      # Allow the generic 'webhook' channel kind to hit http:// and LAN addresses
      # (e.g. a self-hosted ntfy/gotify). discord/slack stay locked to public hosts.
      # - WEBHOOK_ALLOW_INSECURE=true
      # Self-hosted default: embedded SQLite. For cloud, point at Postgres:
      # - DATABASE_URL=postgresql+asyncpg://hub:hub@postgres:5432/hub
      - DATABASE_URL=sqlite+aiosqlite:////app/data/hub.db
      - CORS_ORIGINS=http://localhost:3000
      # Hosted billing service only (never ship the private key to customer hubs):
      # - STRIPE_WEBHOOK_SECRET=whsec_...
      # - LICENSE_SIGNING_PRIVATE_KEY=<base64 raw 32-byte Ed25519 private key>
      # - STRIPE_PRODUCT_PLANS_JSON={"prod_enterprise":{"tier":"enterprise","max_nodes":100,"features":["*"]}}
      # - BILLING_EMAIL_ENABLED=true
      # - BILLING_EMAIL_FROM=licenses@example.com
      # - BILLING_SMTP_HOST=smtp.example.com
      # - BILLING_SMTP_USERNAME=...
      # - BILLING_SMTP_PASSWORD=...
    volumes:
      - hub-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: control-plane-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HUB_URL=http://control-plane-hub:8080
      # If the hub sets ADMIN_TOKEN, operators paste it into the dashboard
      # (stored client-side); it is not baked into the image.
    depends_on:
      - control-plane-hub

  # Uncomment for multi-tenant cloud mode.
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     - POSTGRES_USER=hub
  #     - POSTGRES_PASSWORD=hub
  #     - POSTGRES_DB=hub
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  hub-data:
  # pg-data:
