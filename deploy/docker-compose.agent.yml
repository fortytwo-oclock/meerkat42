services:
  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    image: meerkat42-agent:local
    restart: unless-stopped
    env_file:
      - ${AGENT_ENV_FILE:-agent.env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    # No inbound ports are published. Add host paths, devices, or capabilities
    # only when enabling Vault backups or deep SMART inspection.
