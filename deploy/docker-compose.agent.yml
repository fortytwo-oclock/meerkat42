version: '3.8'

services:
  control-plane-agent:
    image: ghcr.io/controlplane/edge-agent:latest
    container_name: control-plane-agent
    restart: unless-stopped
    # Outbound only: NO inbound ports exposed!
    environment:
      - HUB_URL=wss://hub.yourdomain.com/api/v1/agent/stream
      - NODE_ID=proxmox-node-01
      - AUTH_TOKEN=agent_secret_token_change_me
      - CLIENT_GROUP=Client-Apex
      - PUSH_INTERVAL_SEC=10
    volumes:
      # Read-only Docker socket for container lifecycle & crash-loop monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read-only host kernel /proc & /sys for CPU, RAM, load, and storage metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    # Optional: Give SYS_RAWIO capability only if deep S.M.A.R.T. disk scanning is needed
    cap_add:
      - SYS_RAWIO
    devices:
      - /dev/sda:/dev/sda:r
      - /dev/sdb:/dev/sdb:r
